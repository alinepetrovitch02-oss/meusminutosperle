<div class="cycle-values" aria-label="Valores estimados do ciclo">

  <div class="cycle-value">
    <div>
      <div class="cycle-value-label">
        Valor estimado em reais (com taxa do Airtm)
      </div>
      <div class="cycle-value-note">
        Considerando os minutos gravados, se aceitos
      </div>
    </div>
    <strong class="cycle-value-amount" id="cycleRecordedValue">
      R$ 0,00
    </strong>
  </div>

  <div class="cycle-value">
    <span class="cycle-value-label">
      Minutos gravados (se aceitos)
    </span>
    <strong class="cycle-value-amount" id="cycleRecordedMinutes">
      0 min
    </strong>
  </div>

  <div class="cycle-value">
    <span class="cycle-value-label">
      Minutos já aceitos
    </span>
    <strong class="cycle-value-amount" id="cycleAcceptedValue">
      R$ 0,00
    </strong>
  </div>

</div>
